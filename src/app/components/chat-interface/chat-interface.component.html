<div class="fixed bottom-4 right-4 z-50">
  <!-- Botón flotante del chatbot -->
  <button 
    *ngIf="!isChatOpen"
    (click)="toggleChat()"
    class="fixed bottom-4 right-4 bg-red-600 text-white p-4 rounded-full shadow-lg hover:bg-red-700 transition-colors"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
    </svg>
  </button>

  <!-- Ventana del chat -->
  <div 
    *ngIf="isChatOpen"
    class="fixed bottom-4 right-4 w-96 h-[600px] bg-white rounded-lg shadow-xl flex flex-col"
  >
    <!-- Encabezado del chat -->
    <div class="bg-red-600 text-white p-4 rounded-t-lg flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <img [src]="logoPath" alt="Simple Chatbot" class="h-8 w-8">
        <span class="font-semibold">Simple Chatbot</span>
      </div>
      <button (click)="toggleChat()" class="text-white hover:text-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Área de mensajes -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4" #messageContainer>
      <div 
        *ngFor="let message of messages"
        [class.justify-end]="message.type === 'user'"
        class="flex"
      >
        <div 
          [class.bg-gray-100]="message.type === 'user'"
          [class.bg-red-50]="message.type === 'bot'"
          class="max-w-[80%] rounded-lg p-3"
        >
          <p class="text-gray-800">{{ message.content }}</p>
          <span class="text-xs text-gray-500 mt-1 block">
            {{ message.timestamp | date:'shortTime' }}
          </span>
        </div>
      </div>
    </div>

    <!-- Área de entrada -->
    <div class="border-t p-4">
      <form (ngSubmit)="sendMessage()" class="flex space-x-2">
        <input
          type="text"
          [(ngModel)]="userInput"
          name="userInput"
          placeholder="Type your message..."
          class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-red-500"
        >
        <button
          type="submit"
          class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors"
        >
          Send
        </button>
      </form>
    </div>
  </div>
</div>
