<div class="flex flex-col h-screen bg-gray-100">
  <!-- Chat Header -->
  <div class="bg-yellow-500 p-4 shadow-md">
    <h1 class="text-2xl font-bold text-white text-center">Carl's Jr Chat Bot</h1>
  </div>

  <!-- Chat Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngFor="let message of messages" class="flex flex-col">
      <div [ngClass]="{
        'bg-white rounded-lg p-4 max-w-[80%] self-start': message.type === 'bot',
        'bg-blue-500 text-white rounded-lg p-4 max-w-[80%] self-end': message.type === 'user'
      }">
        <div class="whitespace-pre-line">{{ message.content }}</div>
        <div class="text-xs opacity-70 mt-1">
          {{ message.timestamp | date:'shortTime' }}
        </div>
      </div>
    </div>
  </div>

  <!-- Menu Display -->
  <div *ngIf="showMenu" class="bg-white p-4 shadow-md">
    <h2 class="text-xl font-bold mb-4">{{ selectedCategory | titlecase }}</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let item of menuItems | filterByCategory:selectedCategory" 
           class="border rounded-lg p-4 hover:shadow-md transition-shadow">
        <h3 class="font-semibold">{{ item.name }}</h3>
        <p class="text-gray-600 text-sm">{{ item.description }}</p>
        <p class="text-yellow-500 font-bold mt-2">${{ item.price }}</p>
        <button (click)="addItemToOrder(item)"
                class="mt-2 bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 transition-colors">
          Agregar al carrito
        </button>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="bg-white p-4 border-t">
    <div class="flex space-x-2">
      <input type="text" 
             [(ngModel)]="userInput"
             (keyup.enter)="sendMessage()"
             placeholder="Escribe tu mensaje..."
             class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500">
      <button (click)="sendMessage()"
              class="bg-yellow-500 text-white px-6 py-2 rounded-lg hover:bg-yellow-600 transition-colors">
        Enviar
      </button>
    </div>
  </div>
</div>
